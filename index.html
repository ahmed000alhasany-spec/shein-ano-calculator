<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEIN Ano | حاسبة السلة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}
.header{
  background:#000;
  color:#fff;
  padding:30px 20px;
  text-align:center;
}
.logo{font-size:34px;font-weight:800}
.logo span{color:#ff5b9d}
.subtitle{margin-top:7px;color:#ddd}
.container{
  max-width:650px;
  margin:25px auto;
  padding:0 16px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#000;
  color:#fff;
  font-size:17px;
  font-weight:700;
}
.badge{
  background:#fff0f6;
  color:#d72d75;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  display:inline-block;
}
.result{display:none}
.product{
  border-bottom:1px solid #eee;
  padding:14px 0;
}
.product:last-child{border-bottom:0}
.product-name{
  font-weight:700;
  line-height:1.5;
}
.product-meta{
  margin-top:7px;
  color:#666;
  font-size:14px;
}
.product-iqd{
  margin-top:6px;
  font-weight:800;
}
.total{
  text-align:center;
  background:#000;
  color:#fff;
  border-radius:16px;
  padding:20px;
  margin-top:18px;
}
.total small{color:#ccc}
.total strong{
  display:block;
  font-size:30px;
  margin-top:7px;
}
.note{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.7;
}
.loader{
  display:none;
  text-align:center;
  padding:15px;
}
.error{
  display:none;
  background:#fff0f0;
  color:#b00020;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">SHEIN <span>Ano</span></div>
  <div class="subtitle">حاسبة سلة شي إن 🇦🇪</div>
</div>

<div class="container">

  <div class="card">
    <span class="badge">ستور الإمارات 🇦🇪</span>

    <br><br>

    <label>رابط سلة SHEIN</label>
    <input
      id="cartUrl"
      type="url"
      placeholder="الصق رابط السلة هنا..."
    >

    <label>سعر الصرف</label>
    <input
      id="exchange"
      type="number"
      value="1320"
    >

    <button onclick="calculateCart()">
      احسب السلة
    </button>

    <div id="loader" class="loader">
      جاري قراءة السلة...
    </div>

    <div id="error" class="error"></div>
  </div>

  <div id="result" class="card result">
    <div id="products"></div>

    <div class="total">
      <small>المجموع النهائي بالعراقي</small>
      <strong id="totalIQD">0 د.ع</strong>
    </div>
  </div>

  <div class="note">
    الأسعار تعتمد على السعر العام والعروض الظاهرة بدون تسجيل دخول.<br>
    لا يتم احتساب الكوبونات أو النقاط أو خصومات الحساب.
  </div>

</div>

<script>
async function calculateCart() {
  const url = document.getElementById("cartUrl").value.trim();
  const rate = Number(document.getElementById("exchange").value);

  const error = document.getElementById("error");
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");
  const productsBox = document.getElementById("products");

  error.style.display = "none";
  result.style.display = "none";
  productsBox.innerHTML = "";

  if (!url) {
    showError("الصق رابط سلة SHEIN أولاً.");
    return;
  }

  if (!rate || rate <= 0) {
    showError("اكتب سعر صرف صحيح.");
    return;
  }

  loader.style.display = "block";

  try {
    const response = await fetch("/api/cart", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "تعذر قراءة السلة."
      );
    }

    if (!data.products || !data.products.length) {
      throw new Error("ما حصلنا منتجات داخل الرابط.");
    }

    let totalIQD = 0;

    data.products.forEach(product => {
      const qty = Number(product.quantity || 1);
      const aed = Number(product.priceAED || 0);

      // حالياً نحول قيمة السعر اللي يرجعها السيرفر مباشرة
      // حسب سعر الصرف اللي يكتبه المستخدم.
      const iqd = aed * rate * qty;
      totalIQD += iqd;

      const div = document.createElement("div");
      div.className = "product";

      div.innerHTML = `
        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-meta">
          السعر: ${aed.toFixed(2)} |
          الكمية: ${qty}
        </div>

        <div class="product-iqd">
          ${Math.round(iqd).toLocaleString("en-US")} د.ع
        </div>
      `;

      productsBox.appendChild(div);
    });

    document.getElementById("totalIQD").innerText =
      Math.round(totalIQD).toLocaleString("en-US") + " د.ع";

    result.style.display = "block";

  } catch (err) {
    showError(err.message);
  } finally {
    loader.style.display = "none";
  }
}

function showError(message) {
  const error = document.getElementById("error");
  error.innerText = message;
  error.style.display = "block";
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
