<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEIN Ano | حاسبة السلة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}
.header{
  background:#000;
  color:#fff;
  padding:30px 20px;
  text-align:center;
}
.logo{font-size:34px;font-weight:800}
.logo span{color:#ff5b9d}
.subtitle{margin-top:7px;color:#ddd}
.container{
  max-width:600px;
  margin:25px auto;
  padding:0 16px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#000;
  color:white;
  font-size:17px;
  font-weight:700;
}
button:active{opacity:.8}
.rate{
  display:flex;
  align-items:center;
  gap:8px;
}
.rate input{margin:0}
.badge{
  background:#fff0f6;
  color:#d72d75;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}
.result{display:none}
.total{
  text-align:center;
  background:#000;
  color:#fff;
  border-radius:16px;
  padding:20px;
}
.total small{color:#ccc}
.total strong{
  display:block;
  font-size:30px;
  margin-top:7px;
}
.note{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.7;
}
.loader{
  display:none;
  text-align:center;
  padding:15px;
}
.error{
  display:none;
  background:#fff0f0;
  color:#b00020;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">SHEIN <span>Ano</span></div>
  <div class="subtitle">حاسبة سلة شي إن 🇦🇪</div>
</div>

<div class="container">

  <div class="card">
    <span class="badge">ستور الإمارات 🇦🇪</span>

    <br><br>

    <label>رابط سلة SHEIN</label>
    <input
      id="cartUrl"
      type="url"
      placeholder="الصق رابط السلة هنا..."
    >

    <label>سعر الصرف</label>
    <div class="rate">
      <input
        id="exchange"
        type="number"
        value="1320"
      >
      <strong>د.ع</strong>
    </div>

    <br>

    <button onclick="calculateCart()">
      احسب السلة
    </button>

    <div id="loader" class="loader">
      جاري قراءة السلة...
    </div>

    <div id="error" class="error"></div>
  </div>

  <div id="result" class="card result">
    <div class="total">
      <small>المجموع التقريبي</small>
      <strong id="totalIQD">0 د.ع</strong>
    </div>
  </div>

  <div class="note">
    SHEIN Ano<br>
    ستور الإمارات 🇦🇪<br>
    سعر الصرف قابل للتغيير
  </div>

</div>

<script>
async function calculateCart(){

  const url =
    document.getElementById("cartUrl").value.trim();

  const rate =
    Number(document.getElementById("exchange").value);

  const error =
    document.getElementById("error");

  const loader =
    document.getElementById("loader");

  const result =
    document.getElementById("result");

  error.style.display="none";
  result.style.display="none";

  if(!url){
    error.innerText="الصق رابط سلة SHEIN أولاً";
    error.style.display="block";
    return;
  }

  if(!url.includes("shein.com")){
    error.innerText="هذا مو رابط SHEIN";
    error.style.display="block";
    return;
  }

  if(!rate || rate <= 0){
    error.innerText="اكتب سعر صرف صحيح";
    error.style.display="block";
    return;
  }

  loader.style.display="block";

  /*
    بالخطوة الجاية نربط هذا المكان
    بالسيرفر حتى يقرأ أسعار سلة
    SHEIN الإمارات تلقائياً.
  */

  setTimeout(function(){
    loader.style.display="none";

    error.innerText=
      "واجهة الحاسبة جاهزة ✅ باقي ربط قراءة سلة SHEIN.";
    error.style.display="block";

  },700);
}
</script>

</body>
</html>
