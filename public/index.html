<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHEIN Ano - حاسبة السلة</title>
<style>
:root{--pink:#ff3f8e;--pink2:#ff74ad;--bg:#0d0d0f;--card:#17171b;--text:#fff;--muted:#a9a9b2;--line:#2a2a31;--success:#26c281;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#0a0a0c,#141418 35%,#0d0d0f);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:20px 14px 120px}.brand{text-align:center;padding:18px 0 8px}.brand .shein{font-size:34px;font-weight:900;letter-spacing:2px}.brand .ano{font-size:34px;font-weight:900;color:var(--pink);margin-right:8px}.subtitle{color:var(--muted);font-size:14px;margin-top:5px}
.box{background:rgba(23,23,27,.95);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);margin-top:16px}
label{display:block;font-weight:700;margin-bottom:9px}.inputrow{display:flex;gap:8px}textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);background:#0f0f12;color:#fff;border-radius:14px;padding:14px;font-size:15px;outline:none}textarea:focus{border-color:var(--pink)}
button{font-family:inherit;cursor:pointer;border:0}.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:800;border-radius:14px;padding:0 18px;white-space:nowrap}.primary:disabled{opacity:.55;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.6}.status{display:none;margin-top:12px;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}.status.err{display:block;background:#2d1719;border:1px solid #6b2b30;color:#ffd6d8}.status.ok{display:block;background:#14271f;border:1px solid #285b45;color:#d6ffea}
.summary{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#101014;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.stat .n{font-size:22px;font-weight:900;color:var(--pink)}.stat .t{font-size:12px;color:var(--muted);margin-top:3px}
.products{margin-top:14px;display:none}.product{display:grid;grid-template-columns:88px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}.product img{width:88px;height:112px;object-fit:cover;border-radius:14px;background:#222}.pname{font-size:14px;font-weight:750;line-height:1.45}.meta{font-size:11px;color:var(--muted);margin-top:4px}.price{color:var(--pink);font-weight:900;font-size:16px;margin-top:8px}.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.qty{display:flex;align-items:center;gap:9px;background:#0e0e11;border:1px solid var(--line);border-radius:12px;padding:5px}.qty button{width:32px;height:32px;border-radius:9px;background:#24242a;color:#fff;font-size:20px;font-weight:800}.qty .count{min-width:26px;text-align:center;font-weight:900}.ptotal{font-size:12px;color:var(--muted);text-align:left}.ptotal strong{display:block;color:#fff;font-size:14px;margin-top:3px}
.footerbox{display:none;margin-top:14px}.note{background:#101014;border:1px dashed #41414b;border-radius:16px;padding:12px 14px;color:#d7d7dd;font-size:13px;line-height:1.7}.copy{width:100%;padding:15px;border-radius:15px;margin-top:12px;background:#fff;color:#111;font-weight:900;font-size:16px}.copy.ok{background:var(--success);color:#fff}
.loading{display:none;text-align:center;padding:18px;color:var(--muted)}.spinner{width:24px;height:24px;border:3px solid #333;border-top-color:var(--pink);border-radius:50%;margin:0 auto 8px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:460px){.inputrow{display:block}.primary{width:100%;height:48px;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="shein">SHEIN</span><span class="ano">Ano</span><div class="subtitle">احسبي سلتچ بسهولة وبالدينار العراقي</div></div>
  <div class="box">
    <label for="cart">رابط سلة شي إن</label>
    <div class="inputrow">
      <textarea id="cart" placeholder="الصقي رابط السلة أو نص المشاركة الكامل هنا"></textarea>
      <button id="calcBtn" class="primary" onclick="calculate()">احسب السلة</button>
    </div>
    <div class="hint">السعر غير شامل التوصيل. سعر الصرف محسوب تلقائياً داخل الموقع.</div>
    <div id="status" class="status"></div>
    <div id="loading" class="loading"><div class="spinner"></div>جاري قراءة السلة...</div>
    <div id="summary" class="summary">
      <div class="stat"><div id="itemsCount" class="n">0</div><div class="t">عدد القطع</div></div>
      <div class="stat"><div id="grandTotal" class="n">0</div><div class="t">المجموع بالدينار</div></div>
    </div>
  </div>
  <div id="products" class="products"></div>
  <div id="footerbox" class="box footerbox">
    <div class="note">تكدرين تزيدين أو تقللين كمية أي منتج من + و −، والمجموع يتحدث تلقائياً.</div>
    <button id="copyBtn" class="copy" onclick="copyOrder()">نسخ تفاصيل الطلب</button>
  </div>
</div>
<script>
const RATE = 1320;
let products = [];
let resolvedLink = "";

function money(n){return Math.round(n).toLocaleString("en-US")+" د.ع"}
function status(msg,type="err"){const s=document.getElementById("status");s.textContent=msg;s.className="status "+type}
function hideStatus(){document.getElementById("status").className="status";document.getElementById("status").textContent=""}

async function calculate(){
  const input=document.getElementById("cart").value.trim();
  if(!input){status("الصقي رابط السلة أولاً");return}
  hideStatus();
  const loading=document.getElementById("loading"), btn=document.getElementById("calcBtn");
  loading.style.display="block";btn.disabled=true;
  document.getElementById("products").style.display="none";
  document.getElementById("summary").style.display="none";
  document.getElementById("footerbox").style.display="none";
  try{
    const r=await fetch("/api/cart",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||"تعذر قراءة السلة");
    products=(data.products||[]).map(p=>({...p,qty:Math.max(1,Number(p.qty)||1)}));
    resolvedLink=data.url||input;
    if(!products.length) throw new Error("ما گدرنا نستخرج منتجات من هذا الرابط. جربي رابط مشاركة السلة من تطبيق SHEIN نفسه.");
    document.getElementById("summary").style.display="grid";
    document.getElementById("products").style.display="block";
    document.getElementById("footerbox").style.display="block";
    status(`تمت قراءة ${products.length} منتج من السلة ✓`,"ok");
    render();
  }catch(e){status(e.message||"صار خطأ أثناء قراءة السلة")}
  finally{loading.style.display="none";btn.disabled=false}
}
function changeQty(i,d){products[i].qty=Math.max(1,products[i].qty+d);render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
  const h=document.getElementById("products");h.innerHTML="";
  products.forEach((p,i)=>{
    const unit=Number(p.usd)*RATE,total=unit*p.qty, el=document.createElement("div");el.className="product";
    el.innerHTML=`<img src="${esc(p.img||"")}" alt="" onerror="this.style.visibility='hidden'"><div><div class="pname">${esc(p.name||"منتج SHEIN")}</div>${p.variant?`<div class="meta">${esc(p.variant)}</div>`:""}<div class="price">${money(unit)}</div><div class="qtyrow"><div class="qty"><button onclick="changeQty(${i},1)">+</button><span class="count">${p.qty}</span><button onclick="changeQty(${i},-1)">−</button></div><div class="ptotal">مجموع المنتج<strong>${money(total)}</strong></div></div></div>`;
    h.appendChild(el);
  });updateSummary()
}
function updateSummary(){let c=0,t=0;products.forEach(p=>{c+=p.qty;t+=Number(p.usd)*RATE*p.qty});document.getElementById("itemsCount").textContent=c;document.getElementById("grandTotal").textContent=Math.round(t).toLocaleString("en-US")}
async function copyOrder(){
  let c=0,t=0,lines=[];products.forEach((p,i)=>{const u=Math.round(Number(p.usd)*RATE),pt=u*p.qty;c+=p.qty;t+=pt;lines.push(`${i+1}. ${p.name} × ${p.qty} — ${pt.toLocaleString("en-US")} د.ع`)});
  const text=`طلب SHEIN Ano\n\n${lines.join("\n")}\n\nعدد القطع: ${c}\nالمجموع: ${t.toLocaleString("en-US")} د.ع\nالسعر غير شامل التوصيل\n\nرابط السلة:\n${resolvedLink}`;
  try{await navigator.clipboard.writeText(text);const b=document.getElementById("copyBtn");b.textContent="تم النسخ ✓";b.classList.add("ok");setTimeout(()=>{b.textContent="نسخ تفاصيل الطلب";b.classList.remove("ok")},1800)}catch(e){alert(text)}
}
</script>
</body>
</html>
